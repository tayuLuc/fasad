# about.toml — конфигурация `cargo about generate` (поставщик THIRD-PARTY-
# LICENSES.txt в релизный бандл, SPEC §10 п.9; рецепт `just deps-licenses`).
#
# Синтаксис — по первичке cargo-about 0.9.2 (EmbarkStudios/cargo-about,
# docs/src/cli/generate/config.md @tag 0.9.2, промер 21.10): поля `accepted`,
# `targets`, `ignore-*`, `workarounds`, `[<crate>.clarify]`.
#
# allow-список ЗЕРКАЛИТ `deny.toml [licenses] allow` (гейт cargo-deny — владелец
# чисел; расхождение = красный `just deps-licenses`, потому что бандл не имеет
# права показывать лицензии, которые наш же гейт считает запрещёнными).

accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# Цели релизной матрицы (docs/release.md §Матрица). Крейты, попадающие в граф
# только через cfg() чужих целей, из списка выпадают — первичка поля `targets`.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# ring/rustls: встроенные workarounds cargo-about (первичка
# docs/src/cli/generate/workarounds.md @0.9.2) — лицензионные выражения этих
# крейтов харвестится с оговорками, включены списком, а не ручной clarify.
workarounds = ["ring", "rustls"]
