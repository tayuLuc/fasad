[package]
name         = "guard-daemon"
description  = "Стендэлон-демон: axum-роуты, rust-embed UI, fail-closed middleware"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "fasad"
path = "src/main.rs"

# Второй бинарь = тот же код с зашитой фичей `tray` (#128 фаза 2). Держим
# фичу на bin-секции, а НЕ в default: default-фича отравила бы CI-матрицу
# (linux-нога краснеет, §16) и релизный headless-бинарь. `required-features`
# не нужен: фичу включает сам путь сборки (`just release-build-tray`).
[[bin]]
name = "fasad-tray"
path = "src/main.rs"
required-features = ["tray"]

[dependencies]
guard-types     = { path = "../guard-types" }
guard-detectors = { path = "../guard-detectors" }
guard-onnx      = { path = "../guard-onnx" }
guard-vault     = { path = "../guard-vault" }
tokio      = { workspace = true }
axum       = { workspace = true }
# `BodyExt::frame` — собственный счётчик байт тела: перелив лимита (413)
# отличаем от битого потока (400). Crate уже в дереве axum, lock не двигается.
http-body-util = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
zeroize    = { workspace = true }
# Base64-обход каскада-0 (PR #94): декод кандидатов `base64(ПДн)` двумя
# алфавитами. Тот же workspace-пин, что у vault (0.23.1, `alloc`-only, без std,
# без сетей — `just net-audit` крейт не в чёрном списке).
base64            = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# Возвращён атомом 7c (SPEC §10 п.7): прокси `/v1/chat/completions`. До этого
# с шага 6 (атом D, #56 п.5 «не тащи сети») демону не было права линковать клиент
# вообще, и это проверялось гейтом `just net-audit`. Теперь гейт проверяет
# обратное и более строгое: клиент ровно один, в одном файле (`src/proxy.rs`),
# синхронный `ureq` с `default-features = false` (rustls + webpki-roots, без
# gzip/cookies/brotli/charset/json — промер в docs/dep-verify-crates.md §14), и
# ни одного второго сетевого пути в crate.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Только `Stream` для `Body::from_stream` (прокси-стрим из блокирующей задачи).
# `tokio-stream` не берём: этот крейт уже в дереве через axum, lock не двигается.
futures-core = { version = "0.3", default-features = false }
# sha256-гейт загрузки весов (#192, `src/fetch.rs`): поточный хеш скачанного.
# Пин = пакет УЖЕ в Cargo.lock (0.11.0, транзитив rust-embed-utils/guard-vault,
# промер `cargo tree -i sha2` этой сессии) = новых узлов в дереве ноль;
# `just net-audit` крейт не в чёрных списках (хеш-функция, не транспорт).
sha2 = { workspace = true }
# Иконка трея для win/mac (#128 фаза 2, решение оператора в комментарии к issue:
# «трей ДЕЛАЕМ — Linux-сервер = systemd-юнит, Windows и macOS = трей»). Пин и
# `default-features = false` — вердикт docs/dep-verify-crates.md §16: дефолт
# крейта на linux = `libappindicator` → muda/gtk3 → GTK3-вес + системный
# libappindicator3, а без него linux-сборка физически невозможна (`compile_error`
# в `tray-icon-0.26.1/src/lib.rs:128-138`, промер §16 и этой сессии).
# `optional = true`: линкуется только под фичей `tray` ниже; на linux фича
# красной строкой компилятора (см. [features]).
tray-icon = { version = "0.26.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# Витрина отказа старта на Windows (#190): `MessageBoxW` — вызывается из
# `main.rs::refuse_startup` под cfg `all(feature = "tray", target_os =
# "windows")` (модуль-остров `src/tray/win.rs`). НЕ optional и НЕ в списке
# фичи `tray`: win-сборка build-test (feature-off) тоже отказывает старта́ми
# (e2e-контур `full_bin_without_model_dir_refuses_to_start_before_binding`
# живёт на windows-ноге — хук компилируется в обоих конфигурациях), а
# перечисление в `tray` добавило бы в граф фичи второй оконный вход (net_audit
# fact-5 меряет граф фичи linux-мишенью; промер: `cargo tree --features tray
# --target x86_64-unknown-linux-gnu` = НОЛЬ windows-sys, с этой декларацией).
# Пин = ТОТ ЖЕ 0.61.2, что в Cargo.lock (win-бэкенд tray-icon: `>=0.60,
# <=0.61`, первичка Cargo.toml tray-icon-0.26.1:177-185) = ноль новых пакетов
# (диф lock = одна строка объявления). Feature `Win32_UI_WindowsAndMessaging`
# = окно `MessageBoxW` (первичка Windows/Win32/UI/WindowsAndMessaging:
# `windows_link::link!("user32.dll" …)` — raw-dylib, линковка user32 идёт
# через `#[link]`, без build-металла). Лицензии MIT/Apache — allow-лист
# deny.toml (пакет и так в дереве tray-icon, `just deny` промеряет).
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
# Монтаж каскадов 1–2 (issue #14A, SPEC §2): модельный путь демона — lockR
# (`guard_onnx::extract`) + арбитр Decide (`guard_onnx::arbitrate`).
#
# Выключена по умолчанию осознанно:
# 1. `ort` rc.14 + `tokenizers` тяжёлые, и продакшн-сборка с весами собирается
#    явно (`--features guard-daemon/ort-inference`, см. release-контур #76);
# 2. CI-матрица (build-test, linux+windows) обязана оставаться зелёной и без
#    весов: юнит-тесты стад-машины гоняют [`cascades::Cascade12`] на фейке;
# 3. сетевых крейтов фича не добавляет — `ort` приходит транзитивно из
#    `guard-onnx`, в манифесте демона его имени нет (`just net-audit`).
# С включённой фичей и заданным `FASAD_MODEL_DIR` демон поднимает каскады на
# старте; не поднялись — старт отказывает (`cascades::startup`), молчаливой
# деградации до каскада 0 не существует.
ort-inference = ["guard-onnx/ort-inference"]
# Иконка трея (#128 фаза 2): default OFF — CI-матрица трёх ОС не трогается,
# feature-off = обычные ноги; релизный headless-бинарь (`just release-build`
# без фичи, #76/#128) не линкует GUI. Сузление нити #151 M2: локальная
# `cargo build --features tray` собирает ОБЕ цели bin (`fasad` + `fasad-tray`,
# features пер-крейт) — в on-сборке код трея есть и в `fasad`.
#
# Linux: фича ФИЗИЧЕСКИ недоступна. При `tray-icon` с `default-features = false`
# крейт красит `compile_error!("either the `libappindicator` or `ksni` feature
# must be enabled on Linux and BSD")` (`tray-icon-0.26.1/src/lib.rs:128-138`,
# промер §16) — легальной headless-сборки трея на linux нет ни одной фичей;
# `ksni`-лег отклонён §16 (Unlicense вне allow-листа deny.toml + zbus-unmaintained
# RUSTSEC). Красная строка приходит ОТ КОМПИЛЯТОРА на `cargo check --features
# tray` под linux-таргетом (промер этой сессии на x86_64-unknown-linux-gnu),
# в рантайме проверять нечего. Код модуля `tray` гейтится cfg-мишенью win/mac.
#
# `dep:`-форма (не строка `"tray-icon"`): строка в списке фич включила бы и
# дефолты самого tray-icon (`default = ["libappindicator"]`) — ровно ту GTK3-
# ловушку, от которой вердикт §16 спасает `default-features = false`.
# `windows-sys` в список фичи НЕ входит (#190): опциональная target-зависимость
# включается сама ОС-мишенью (`[target.'cfg(windows)'.dependencies]`, код
# витрины `src/tray/win.rs` гейтится тем же cfg + фичей tray), а перечисление
# в `tray` при прицельном `--features tray --target windows` добавило бы в
# win-дерево фичи ещё один вход — net_audit fact-5 проверяет граф фичи `tray`
# linux-мишенью (оконных крейтов в нём быть не должно: первичка —
# `cargo tree --features tray --target x86_64-unknown-linux-gnu` с этой
# декларацией = НОЛЬ windows-sys, промер этой сессии).
tray = ["dep:tray-icon"]

[dev-dependencies]
# ServiceExt::oneshot для тестов роутера без поднятия сокета.
tower = { version = "0.5", features = ["util"] }
# Проводной e2e-тест разбирает ответы собственного бинаря (`tests/wire_e2e.rs`),
# для этого нужен парсер JSON на стороне клиента.
serde_json = { workspace = true }

[lints]
workspace = true
