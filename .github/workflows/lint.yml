name: lint-actions

# Мегапроверка класса файлов, до которого cargo-гейт не дотягивается: YAML самих
# воркфлоу и шелл-скрипты. Набор и комбинирование — заимствование из tayuLuc/copyosity
# (.github/workflows/lint.yml): 4 линтера MegaLinter из 136. Все четверо блокируют.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  actions-yaml:
    name: Lint (Actions YAML + shell)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9
        env:
          VALIDATE_ALL_CODEBASE: "true"
          APPLY_FIXES: "none"
          ENABLE_LINTERS: ACTION_ACTIONLINT,ACTION_ZIZMOR,YAML_YAMLLINT,BASH_SHELLCHECK
      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megalinter-reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
