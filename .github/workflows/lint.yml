name: lint-actions

# Мегапроверка класса файлов, до которого cargo-гейт не дотягивается: YAML самих
# воркфлоу и шелл-скрипты. Набор и комбинирование — заимствование из tayuLuc/copyosity
# (.github/workflows/lint.yml): 4 линтера MegaLinter из 136. Все четверо блокируют.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  actions-yaml:
    name: Lint (Actions YAML + shell)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: "true"
          APPLY_FIXES: "none"
          ENABLE_LINTERS: ACTION_ACTIONLINT,ACTION_ZIZMOR,YAML_YAMLLINT,BASH_SHELLCHECK
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
