name: release

# SPEC §10 п.9 (шаг 9): релиз по тегу `v*`.
#
# Матрица: ubuntu-24.04, windows-2022, macos-14 (#31 третья платформа).
# Контур бандла = full (рюлинг оператора 22.10, issue #181: «Нужно только
# фулл»): релизные бинари собираются с `ort-inference` (шаг `just
# release-build`/`just release-build-tray`), монтаж каскадов 1–2 в
# HTTP-рантайме — `crates/guard-daemon/src/cascades.rs` (#14A). mac-нога
# линкуется на официальный dylib 1.31.0 (env ORT_* ниже, контракт
# docs/model-audit.md §8; скачивание архива + sha256 = тот же шаг, что job
# `ort-dylib`) и несёт `lib/libonnxruntime.1.dylib` в бандле
# (scripts/make-bundle.sh --ort-dir + install_name_tool -add_rpath).
# win/linux: доставка runtime-библиотеки — onnxruntime.dll в bin/ (win,
# --ort-dll из pyke-кэша build-контура) / динамика-по-пути (linux); первый
# живой промер win/linux full-контура = эта матрица, риск записан в #181.
# Веса (879 МБ) в бандл НЕ входят: бандл несёт scripts/fetch-models.sh +
# models/manifest.tsv + models/README.md (sha256-гейт); mac-ячейка скачивает
# веса шагом ниже и промеряет смонтированный контур в verify-bundle (ЗУБ Б).
# Артефакты метятся `-full`; каскад-0-бандл в релизе не продаётся.
# Job `ort-dylib` (харнес spike на dylib) остаётся: RAM-контур харнеса
# (docs/model-audit.md §10 меряется демоном, харнес — §9 п.3/measure --full).
#
# Пины action'ов — SHA + комментарий с живым промером (первичка: `gh api
# repos/<owner>/<repo>/releases/latest`, промер 21.10.2026):
#   actions/checkout       v7.0.1   (SPEC §9 пинил v4 — просрочен на 3 мажора,
#                                    dep-verify-repos §1 `[PARTIAL]`; latest=v7.0.1)
#   публикация релиза — `gh release` в скрипте, НЕ third-party action (zizmor
#                                    superfluous-actions + поверхность
#                                    `contents: write`)
#   actions/upload-artifact v7.0.2, actions/download-artifact v8.0.2
#   Swatinem/rust-cache    v2.9.3   (у нас plain commit = ЦЕЛЬ аннотированного
#                                    тега v2.9.3: ref → tag-object
#                                    2201cc584a476d1b508be977bbe4b7d1c7a52e9c →
#                                    commit d1527c8f67ef…, промер 21.10;
#                                    `git/tags/<sha>` требует полный sha,
#                                    короткий отвечает 404)
#                                    Прежняя формулировка «в ci.yml пин v2.8.7
#                                    через ANNOTATED tag object» была ложной по
#                                    обоим фактам (ревью #76, F2): тега v2.8.7 у
#                                    апстрима нет (`git/ref/tags/v2.8.7` = 404,
#                                    последний линейки 2.8.x = v2.8.2), а
#                                    ci.yml:33 пинит plain commit 6323deb102c3…,
#                                    озаглавленный «2.9.2», ярлыком `# v2.8.7`.
#                                    Расхождение ярлыка и содержимого — defect
#                                    ci.yml, чинит его владелец, не этот PR.
#   dtolnay/rust-toolchain commit-pin b725eda52536… («toolchain: stable»,
#                                    2026-10-16). Формулировка «мажорных тегов
#                                    нет» (F3, ревью #76) была ложью: moving-тег
#                                    v1 есть — `releases/latest` = v1,
#                                    `git/ref/tags/v1` → commit 683b588c487a.
#                                    Пиним коммит не от бедности, а потому, что
#                                    v1 — движущаяся цель (обновляется вместе со
#                                    stable), а релизный контур обязан быть
#                                    воспроизводимым по sha.
# Аннотированные теги (rust-cache v2.9.3) дереференцены
# в commit через `gh api repos/<r>/git/ref/tags/<t>` → `git/tags/<sha>` — пинить
# sha tag-объекта нельзя, он не resolvable как `uses:`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Workflow-level пусто: каждый job поднимает ровно своё (класс F2 known-red,
# снят PR #10 — тот же профиль, что в ci.yml).
permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    name: dist (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: zip
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: tar.gz
    defaults:
      run:
        # На windows-2022 без явного shell `just` гоняет shebang-рецепты через
        # cmd, где нет ни `set -euo`, ни tar, ни find (тот же класс дефекта, что
        # описан в комментарии к `net-audit` в justfile).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Только чтение кэша. Публикующий воркфлоу не имеет права писать в
          # общий кэш (zizmor cache-poisoning, High: «runtime artifacts potentially
          # vulnerable to a cache poisoning attack»; фикс предложен самим zizmor,
          # input `lookup-only` первичен — action.yml pinned-коммита d1527c8,
          # описание «Check if a cache entry exists without downloading the cache»).
          lookup-only: "true"
      - name: Install just + cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just, cargo-about
      - name: "Установка официального dylib ORT 1.31.0 (mac-контур сборки)"
        # Контракт §W2 п.1: mac release-бинарь с ort-inference линкуется
        # только на официальный dylib (pyke-статика = SIGSEGV в release).
        # Скачивание + sha256 = тот же шаг-контракт, что job `ort-dylib`
        # (матричные ort_archive/ort_sha256 первичка docs/model-audit.md §8
        # п.3). mac-ячейка: dylib нужен И сборке (env-префикс), И бандлу
        # (make-bundle --ort-dir), поэтому шаг именно здесь.
        # Формат сверки — канон `sha256sum -c` (две строки, два пробела),
        # BSD/GNU читают одинаково (урок #76 D3: sed-вырезка ломала формат).
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          url="https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-osx-arm64-1.31.0.tgz"
          curl -sSfL --retry 3 -A "fasad-release-ci/1.0" -o "$RUNNER_TEMP/ort.tgz" "$url"
          printf '%s  %s\n' "1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc" "$RUNNER_TEMP/ort.tgz" > "$RUNNER_TEMP/ort.sum"
          ( cd "$RUNNER_TEMP" && sha256sum -c ort.sum )
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP/ort"
          echo "ORT_DIR=$RUNNER_TEMP/ort/onnxruntime-osx-arm64-1.31.0" >> "$GITHUB_ENV"
      - name: "Релизный бинарь (full: ort-inference; профиль release: lto=fat, strip)"
        # Контур #181 (рюлинг оператора 22.10: «Нужно только фулл»). mac:
        # ORT_DIR из шага выше → рецепт ставит env-префикс dylib-контракта.
        # win/linux: каталога $ORT_DIR/lib нет → рецепт линкует без префикса
        # (win: pyke-download + copy-dylibs, delivery dll рядом с exe;
        # linux: download-binaries статик + динамика libonnxruntime.so;
        # ПЕРВЫЙ живой промер этих веток = эта матрица, риск #181).
        run: just release-build
      - name: "Веса каскадов 1–2 (mac: доставка в кеш для ЗУБа Б verify)"
        # mac-контур промеряет смонтированный контур живьём (verify-bundle
        # ЗУБ Б: stage=cascade-0+models + person_name-спан). 879 МБ с HF,
        # sha256-гейт манифеста (fail-closed). Linux: доставка не смонтирована
        # (verify ЗУБ Б = unit-доказательства; win/linux HF-кеш в релизной
        # матрице = +2×879 МБ трафика на каждый тег, решение #181).
        if: matrix.os == 'macos-14'
        run: bash scripts/fetch-models.sh --no-rewrite
      - name: "Трей-бинарь win/mac (features tray,ort-inference, #128/#181)"
        # Linux пропускает: фича физически несобираема на linux
        # (compile_error в tray-icon без libappindicator/ksni —
        # docs/dep-verify-crates.md §16), linux-контур = systemd (#140).
        # #181: трей = тот же main.rs (монтаж #14A), собирается С ort-inference
        # — в full-бандле оба бинаря одного контура.
        if: matrix.os != 'ubuntu-24.04'
        run: just release-build-tray
      - name: "Linux-бандл: systemd-юнит (#140)"
        # Кладём юнит в dist/ — make-bundle.sh берёт его с дерева (linux-ветка
        # требует contrib/systemd/fasad.service), этот шаг — явная запись
        # контура в воркфлоу: юнит едет в бандл, а не в air.
        if: matrix.os == 'ubuntu-24.04'
        run: ls -la contrib/systemd/fasad.service
      - name: RAM-гейт каскад-0-фазы релизного демона (SPEC §10 п.9, метод в выводе)
        # Контур замера = каскад-0-фазы демона (#181): релизный бинарь
        # (full, шаг release-build) без FASAD_MODEL_DIR стартует стадией
        # cascade-0-only, RAM-контур замера не двигается (полный смонтированный
        # контур меряется §10: пики 825.7–1466.5 MiB против бюджета 1843.2,
        # verdict ok — docs/model-audit.md §10 п.3/п.4).
        # Windows-ветки метода замера (PowerShell Get-Process) не реализовано:
        # scripts/measure-rss.sh на неизмеренной ОС падает с exit 2 и явной
        # причиной, а не рисует ноль (rc=2 промерен шимом `uname` = FreeBSD,
        # ревью #98 R1: до правки ветка звала die = rc=1, т.е. «2» обещали три
        # места, а в скрипте его не было).
        # Мусор в env BUDGET_MIB (разделитель в «1,843.2», буквы) = rc=1 до
        # замера (ревью #98 R2): без валидации awk читал «abc» как 0, и шаг
        # зелёнил гейт при любом пике.
        # Зуб шага = код возврата скрипта: при вердикте OVER measure-rss.sh
        # выходит rc=1 (плюс причина в stderr), и step падает. До правки OVER
        # только печатался, rc был 0 и шаг зеленел при превышении бюджета —
        # класс false-green «print-only landing test» (реестр 15/18).
        # `--skip-build`: артефакт уже собран шагом release-build (full);
        # пересборка здесь каскад-0-фичей затёрла бы его в target/ (класс
        # #139) и обрушила verify-зубы А/В ниже.
        if: matrix.os != 'windows-2022'
        run: just measure-rss --skip-build
      - name: "Каскад-0-референс зуба В (win/linux: дискриминатор против full-метки)"
        # verify-bundle ЗУБ В проверяет живым прогомом: бинарь БЕЗ ort-inference
        # при FASAD_MODEL_DIR обязан отказать стартом (BuiltWithoutInference).
        # В mac-контуре target/release/fasad = full-бинарь, референс строится
        # отдельной командой в отдельный target-dir (класс #139: пересборка в
        # общий target затёрла бы релизный артефакт). На mac референс в CI не
        # строится: там live-нога (ЗУБ Б) сильнее, зуб В = local-промер
        # (just release-build-cascade0 + cp).
        # win/linux: доставка весов в CI не смонтирована; BuiltWithoutInference
        # срабатывает ДО чтения весов (cascades.rs:649-650), зуб прогоняется с
        # несуществующим каталогом — референс = target-c0/debug/fasad (дефолт
        # без env-префикса = download-binaries, на linux/mac линкуется; на win
        # голая линковка pyke-статикой = промеренный риск #181, шаг не красным,
        # а continue-on-error: отсутствие референса = SKIPPED-строка в verify,
        # не ложная красная матрица до первого win-промера).
        if: matrix.os != 'macos-14'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p guard-daemon --target-dir target-c0
          echo "FASAD_CASCADE0_BIN=$PWD/target-c0/debug/fasad" >> "$GITHUB_ENV"
      - name: "win-контур: onnxruntime.dll из pyke-кэша (delivery рядом с exe)"
        # win-бинарь линкуется pyke-статикой (build.rs rpath-ветка =
        # macos|linux), рантайм = onnxruntime.dll РЯДОМ с exe (ort-дока
        # setup/linking: «in PATH or next to the exe»; PE RUNPATH нет).
        # ort-sys `copy-dylibs` (build/dynamic_link.rs:14-24, промер 22.10)
        # в build-контуре кладёт dll в target/release/ — берём её оттуда;
        # отсутствие = красным (бинарь собран, а рантайма нет = бандл, который
        # не стартует; риск win-ветки записан в #181).
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          [ -f target/release/onnxruntime.dll ] \
              || { echo "ОШИБКА: target/release/onnxruntime.dll нет — win-бинарь орт-контурный (release-build), а copy-dylibs его не положил"; exit 1; }
          echo "ORT_DLL=$PWD/target/release/onnxruntime.dll" >> "$GITHUB_ENV"
      - name: "Linux-контур: runtime-библиотека орта в артефактах сборки"
        # linux-полный путь: ort-sys download-binaries, рантайм-поиск =
        # LD_LIBRARY_PATH/системный каталог (per ort-дока); доставка в бандле
        # НЕ смонтирована (#181: linux-ячейка промеряется ЗУБОМ А
        # (readelf) + unit-доказательствами, живой mounted-промер = mac).
        # Шаг фиксирует факт сборки динамической зависимости в логе матрицы.
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: readelf -d -l target/release/fasad | grep -i onnxruntime
      - name: "Бандл: бинарь + LICENSE + README + схема + лицензии + модели-инструкция + SHA256SUMS (контур full, #181)"
        run: just dist
      - name: "Проверка бандла: распаковка, запуск, /health, орт-зубы А/Б/В, хэши + тег↔версия"
        env:
          # mac-кеш весов шага fetch-models (дефолт скрипта ~/.cache/...
          # = тот же; явная передача = контракт «CI знает, где лежат веса»).
          FASAD_MODEL_DIR: ${{ matrix.os == 'macos-14' && format('{0}/.cache/fasad-models', runner.home) || '' }}
          # Зуб «тег == [workspace.package] version»: на тег-триггере в скрипт
          # уходит github.ref_name, на workflow_dispatch — пустая строка, и
          # скрипт сам печатает `VERSION|SKIPPED` (проверка не запрашивалась), а
          # не молчит. Без этого зуба контур публиковал зелёный релиз под тегом
          # v9.9.9 над ассетами fasad-0.1.0-*: `gh release create --verify-tag`
          # сверяет тег с КОММИТОМ, версию тега никто не смотрел.
          # Выражение `начало && ref_name || ''` на false даёт '' (строка), т.е.
          # на пуше в ветку env пустой — ровно то, что нужно dispatch-прогону.
          FASAD_EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash scripts/verify-bundle.sh
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fasad-${{ github.ref_name }}-${{ matrix.target }}-full
          path: |
            dist/fasad-*.tar.gz
            dist/fasad-*.zip
            dist/*.sha256
          if-no-files-found: error

  ort-dylib:
    # Сборка каскадов 1–2 (харнес spike) релизным профилем на официальном dylib
    # ONNX Runtime — RAM-контур харнеса (docs/model-audit.md §9 п.3,
    # `measure-rss --full`). С #181 релизные бинари dist-матрицы собираются
    # полным контуром тем же dylib-префиксом (шаг ORT-установки в job `dist`),
    # эта job остаётся: spike-контур мер (харнес) здесь, продукт — в dist.
    # Причина job'ы: на macOS статика pyke в release-профиле
    # SIGSEGV'ит (docs/model-audit-weights.md §W2 п.1, промер ×5), рабочий путь — официальный
    # dylib 1.31.0 + `ORT_PREFER_DYNAMIC_LINK=1` (per первичка ort:
    # https://ort.pyke.io/setup/linking — compile-time dynamic linking =
    # ORT_LIB_PATH + ORT_PREFER_DYNAMIC_LINK=1; доставка рантайма на macOS/Linux —
    # rpath `@loader_path`/`$ORIGIN` или каталог рядом с бинарём, там же).
    # Хэши архивов — первичка docs/model-audit.md §8 п.3 (промер 19.10), не SPEC.
    name: ort-dylib (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            ort_archive: onnxruntime-osx-arm64-1.31.0.tgz
            ort_sha256: 1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc
            ort_dir: onnxruntime-osx-arm64-1.31.0
          - os: ubuntu-24.04
            ort_archive: onnxruntime-linux-x64-1.31.0.tgz
            ort_sha256: cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
            ort_dir: onnxruntime-linux-x64-1.31.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Только чтение кэша. Публикующий воркфлоу не имеет права писать в
          # общий кэш (zizmor cache-poisoning, High: «runtime artifacts potentially
          # vulnerable to a cache poisoning attack»; фикс предложен самим zizmor,
          # input `lookup-only` первичен — action.yml pinned-коммита d1527c8,
          # описание «Check if a cache entry exists without downloading the cache»).
          lookup-only: "true"
      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - name: "Официальный dylib ORT 1.31.0 и сверка sha256"
        run: |
          set -euo pipefail
          url="https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/${{ matrix.ort_archive }}"
          curl -sSfL --retry 3 -A "fasad-release-ci/1.0" -o "$RUNNER_TEMP/ort.tgz" "$url"
          # Ровно ДВА пробела между хэшем и путём, и оба — из формата, а не из
          # аргумента. Промер 21.10 на BSD `/sbin/sha256sum` («sha256sum (Darwin)
          # 1.0»), то есть на macos-14: прежняя форма с `'…  '` внутри аргумента
          # давала четыре пробела, поле пути начиналось с пробела, и
          # `sha256sum -c` отвечал rc=1 («No such file or directory» на
          # существующий файл). Правка 21.10 чинила это `sed -i`, а он на BSD
          # съедает СЛЕДУЮЩИЙ аргумент как суффикс бэкапа: скрипт `'s/…//'`
          # уходил в -i, а его место занималось ИМЕНЕМ ФАЙЛА — файл читался как
          # sed-скрипт, первая строка (`хэш  путь`) ломалась на переводе строки
          # внутри шаблона подстановки: rc=1, «unescaped newline inside
          # substitute pattern» (промер 21.10 на BSD sed этого хоста:
          # `sed: 1: "/tmp/…/ort.sum\n": unescaped newline inside substitute
          # pattern`; прежняя скобка «invalid command code» была текстом чужой
          # ошибки, ревью #76, D3). Гейт умирал ДО сверки хэша. `sed` удалён;
          # форма каноническая, GNU и BSD читают её одинаково.
          printf '%s  %s\n' "${{ matrix.ort_sha256 }}" "$RUNNER_TEMP/ort.tgz" > "$RUNNER_TEMP/ort.sum"
          ( cd "$RUNNER_TEMP" && sha256sum -c ort.sum )
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP/ort"
          ls -1 "$RUNNER_TEMP/ort"
      - name: "Сборка spike с ort-inference (release, dylib)"
        env:
          # Корень распакованного архива = имя самого архива без .tgz
          # (промер локальной распаковки 21.10: onnxruntime-osx-arm64-1.31.0/,
          # onnxruntime-linux-x64-1.31.0/); каталоги `ort_dir` заданы в матрице
          # рядом с `ort_archive`, чтобы они не разъезжались.
          ORT_DIR: ${{ runner.temp }}/ort/${{ matrix.ort_dir }}
        run: just build-ort
      - name: "Проверка линковки: dylib прописан в load commands"
        env:
          ORT_DIR: ${{ runner.temp }}/ort/${{ matrix.ort_dir }}
        run: |
          set -euo pipefail
          bin=target/release/examples/spike
          case "$(uname -s)" in
            Darwin) otool -L "$bin" | grep -i onnxruntime ;;
            Linux) ldd "$bin" | grep -i onnxruntime ;;
          esac
          echo "ort-dylib ok: spike линкуется на официальный dylib 1.31.0 (не на pyke-статику)"

  release:
    name: GitHub Release
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level concurrency: публикация не отменяется на лету. На уровне
    # воркфлоу стоит cancel-in-progress: true — смысл в том, чтобы пуш в ту же
    # ветку не жёг раннёры на сборке матрицы. Для публикующего job то же правило
    # опасно интервалом: между `gh release create` и загрузкой ассетов новый раннер
    # убил бы процесс с УЖЕ СОЗДАННЫМ релизом и не догруженными ассетами
    # (ревью #76, F6). Здесь новый прогон становится в очередь, а не отменяет
    # идущий.
    concurrency:
      group: fasad-release-publish
      cancel-in-progress: false
    permissions:
      # Единственный job с записью: публикация релиза. `contents: write` узок по
      # объёму (релиз + ассеты) и не даёт ни PR, ни пакетов (zizmor
      # excessive-permissions profile: job-level явный минимум).
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Полная история нужна гарду «нет новых коммитов»: `git rev-list
          # prev..TAG` на chekaut'e глубиной 1 слепнет (тегов в дереве нет).
          fetch-depth: 0
      - name: Скачать бандлы матрицы
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fasad-*
          path: artifacts
          merge-multiple: true
      - name: "Что публикуется: сверка имён и хэшей"
        run: |
          set -euo pipefail
          ls -la artifacts
          ( cd artifacts && for f in *.sha256; do sha256sum -c "$f"; done )
      - name: "Гард --fail-on-no-commits: между релизами есть коммиты"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Релиз-пустышка = тег на том же коммите, что предыдущий релиз: ассеты
          # байт-в-байт те же, notes те же, в списке релизов строка-дубль.
          #
          # База сравнения — ПОСЛЕДНЯЯ запись в списке релизов, вместе с
          # черновиками (`gh release list --limit 1`; флаги --exclude-drafts /
          # --exclude-pre-releases есть, мы их намеренно не ставим: свежий
          # черновик = то же намерение публикации, и относительно него дубль
          # тоже дубль). Прогон логики локально (риг на фальшивом gh и
          # настоящем git, 21.10): пустышка v0.1.1 против v0.1.0 → rc=1 с двумя
          # строками причины; v0.2.0 против v0.1.0 → «1 коммит», rc=0; пустой
          # prev (первый релиз) → rc=0 и явное «не применимо», не «проверено»;
          # отсутствующий в дереве prev → git fatal, шаг падает (fail-closed,
          # не зелёный). `jq '.[0].tagName // ""'` на пустом массиве даёт "" без
          # ошибки (промер jq: rc=0).
          prev="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$prev" ]; then
              printf 'Первый релиз в репозитории: сравнивать не с чем, гард не применим\n'
              exit 0
          fi
          n="$(git rev-list --count "${prev}..${TAG}")"
          printf 'Коммитов между %s и %s: %s\n' "$prev" "$TAG" "$n"
          if [ "$n" -eq 0 ]; then
              printf 'ОШИБКА: тег %s указывает на тот же коммит, что %s: релиз-пустышка.\n' "$TAG" "$prev" >&2
              printf 'ОШИБКА: сдвиньте тег на коммит с изменениями или удалите черновик (gh release delete).\n' >&2
              exit 1
          fi
      - name: Опубликовать релиз
        # Публикация — `gh release` в скрипте, а не third-party action: zizmor
        # `superfluous-actions` (confidence High) на softprops/action-gh-release
        # («функциональность уже есть в раннере»), а MegaLinter краснит гейт
        # находкой ЛЮБОЙ severity — промер CI 21.10: run 39514678570,
        # «11 findings (10 suppressed): 1 informational», zizmor rc=11. Плюс из
        # workflow с `contents: write` уходит один сторонний экшен = меньше
        # поверхность supply-chain.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat >notes.md <<'NOTES'
          Контур бандлов: **full** (рюлинг оператора 22.10, issue #181) —
          детерминированные детекторы + vault + модельный путь каскадов 1–2
          (lockR + Decide на ONNX, монтаж #14A). Бандл несёт бинарь(ы) с
          `ort-inference`, инструкцию скачивания весов (`scripts/fetch-models.sh`
          + `models/manifest.tsv`, sha256-гейт, ~879 МБ с Hugging Face — веса в
          архив не входят), mac — `lib/libonnxruntime.1.dylib` (1.31.0), win —
          `bin/onnxruntime.dll`. Без весов демон работает каскадом 0 (стадия в
          `/health`); с `FASAD_MODEL_DIR` и несмонтировавшимися весами старт
          отказывает. Метрики: RAM — `docs/model-audit.md` §9 (каскад-0-фаза)
          и §10 (смонтированный контур), латентность — `docs/model-audit-inference.md`
          §I1. Сборки: `x86_64-unknown-linux-gnu` (ubuntu-24.04),
          `x86_64-pc-windows-msvc` (windows-2022), `aarch64-apple-darwin`
          (macos-14). Каждый бандл несёт `THIRD-PARTY-LICENSES.txt` (cargo-about)
          и `SHA256SUMS.txt`.
          NOTES
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
              printf 'Публиковать нечего: artifacts/ пуст (матрица не оставила ассетов)\n' >&2
              exit 1
          fi
          printf 'Ассеты релиза (%s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
              --verify-tag -- "${files[@]}"
