name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Единый контракт локально и в CI: just-цели из justfile; cargo-deny —
      # гейт advisories/bans/licenses (SPEC §9).
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - run: just lint
      - run: just test
      - run: just deny
