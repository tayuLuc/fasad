name: ci

on:
  push:
    branches: [main]
  pull_request:

# F2 known-red (issue #8): workflow-level none — каждый job поднимает ровно то,
# что ему нужно (build-test ничего не пишет в API, checkout без токена ниже).
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # known-red F2: excessive-permissions — job-level явный минимум (read без
    # токена см. persist-credentials: false).
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # #31: третья платформа. macos-14 = aarch64, тот же раннер, что
        # release.yml:81/165 (ним и промерен). Честность по ORT: ci.yml НЕ
        # линкует onnxruntime ни на одной ОС — под `ort-inference` здесь только
        # clippy-строки (clippy guard-onnx шагом ниже + clippy guard-daemon в
        # justfile:65 через `just lint`),
        # а clippy = check без линковки (build-скрипт ort-sys берёт бинарник по
        # download-binaries, Cargo.toml:90). Runtime-путь macOS с dylib
        # (ORT_LIB_PATH + ORT_PREFER_DYNAMIC_LINK, justfile build-ort) живёт в
        # release.yml job `ort-dylib`; причина — pyke-статика на macOS SIGSEGV'ит
        # в release-профиле (docs/model-audit-weights.md §W2 п.1, промер ×5). `just test`
        # гоняет guard-onnx без фич (justfile:87-90) — тестов, линкуемых на ORT,
        # в матрице нет намеренно.
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # known-red F1 (artipacked): токен в .git/config не нужен — job не пушит.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (composite, без токена)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.7 (F3 known-red: annotated-tag-object форма → plain commit)
      # Единый контракт локально и в CI: just-цели из justfile; cargo-deny —
      # гейт advisories/bans/licenses (SPEC §9).
      # Пинованы SHA тега v2 (2.87.29, 2026-10-16) — zizmor unpinned-uses, внесённый
      # этим дифом, чинится здесь (review B4). bootstrap-пины (checkout/toolchain/
      # rust-cache/megalinter) — отдельный PR, см. known-red-on-main.md.
      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - run: just lint
      # Spike с фичей орта линтится здесь же (review #9 B5): без этого шага
      # example-код с фичей живёт вне CI-гейта.
      - run: cargo clippy -p guard-onnx --all-targets --features ort-inference -- -D warnings -D clippy::unwrap_used
      - run: just test
      - run: just deny

  python-golden:
    # Python-тулинг (gutter, рулинг 19.10: AGENTS п.6): uv-locked линт +
    # побайтовая воспроизводимость golden-датасета на ВСЕХ ТРЁХ ОС (#31:
    # macOS-нога дешёвая, LF-вывод как на ubuntu; CRLF-порчу чек-аута по-прежнему
    # ловит windows-нога — .gitattributes data/golden/** -text; дрейф
    # генератора от правок/зависимостей — вывод заморожен B2-константой).
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv + just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          # `just` обязателен: шаги зовут just-рецепты (контракт §5.5.5 — CI
          # гонят те же команды, что локально). PR#34: python-golden краснел
          # `just: command not found` (exit 127) — uv устанавливался, just нет.
          tool: uv, just
      # --locked: краснит расхождение uv.lock с pyproject.toml (дрейф пинов).
      # Интерпретатор берётся из .python-version (3.15) — uv сам ставит
      # managed-сборку, setup-python не нужен.
      - run: just python-lint
      - run: just golden-verify
